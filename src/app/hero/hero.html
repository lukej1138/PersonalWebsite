<div id="home" class="overflow-hidden text-blue-400 md:m-auto min-h-screen grid items-center justify-center">
  <div class="grid justify-center items-center *:row-1 *:col-1 adjHeight">
    <div class="place-self-center w-full -translate-y-[10%]">
      <div class="items-center justify-center text-center">
        <div class="text-[15vw] md:text-[9vw] font-light header">Lucas Johnson</div>
        <div class="flex text-[10vw] md:text-[4vw] items-center justify-center typing *:opacity-65 min-h-[1.5em] *:border-blue-400/[0.65]">
          <div class="font-extralight">{{typeWriterEffect | async}}</div> <div class="animate-blink border-r-2 h-[0.8em] pl-1 md:pl-2">&#8203;</div>
        </div>
      </div>
    </div>
    <div class="h-5 w-fit place-self-center">
      @for (item of orbitData; track item.id; let i = $index) {
        <div (mouseenter)="togglePause()" (mouseleave)="togglePause()"
        [class.paused] = "pauseLoop()"
        class="orbitPath animate-spin-around"
        [style.animation-duration] = "spinDur() + 's'"
        [style.animation-delay]="'-' + (( spinDur() / orbitData.length) * (i+1)) + 's'">
        <a (click) = "filtersConn.adjustFilters(item.name, false)" [href]="'#projects'"><img class="w-12 h-12 rounded-sm" [src]="item.imgUrl"></a>
        </div>
      }
    </div>
  </div>
</div>
